[project]
name = "ccp"
version = "0.1.0"
description = "Confidential big data for Campus Cham: synthetic test data, PII masking, k-anonymity and a synthetic twin, with privacy/utility evaluation."
readme = "README.md"
authors = [
    { name = "Koduri Mahesh Bhushan Chowdary", email = "mkoduri73@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "faker>=30",
    "numpy>=1.26",
    "pandas>=2.2",
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
    "spacy>=3.7,<3.9",
    "sdv>=1.15",
    "torch>=2.3",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "en-core-web-md",
    "de-core-news-md",
    "tabulate>=0.10.0",
    "smartnoise-synth>=1.0.8",
    "anonymeter>=1.1.0",
    "gliner>=0.2.30",
]

[project.scripts]
ccp = "ccp.cli:main"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
en-core-web-md = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl" }
de-core-news-md = { url = "https://github.com/explosion/spacy-models/releases/download/de_core_news_md-3.8.0/de_core_news_md-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
